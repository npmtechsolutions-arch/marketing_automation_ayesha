name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    # The suite itself runs on in-memory SQLite, but a Postgres service is here
    # so migrations are exercised against the engine production actually uses --
    # SQLite would not catch a Postgres-only DDL mistake.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/marketengine
      # Redis is not run here; the app falls back to in-process counters and
      # logs a warning, which is correct behaviour for a single-process test.
      REDIS_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        # Scoped to the code this project owns and to the rules it currently
        # satisfies. The repository has a backlog of findings against ruff's
        # full default set; failing CI on those would mean every PR is red for
        # reasons unrelated to the change in it. Widen as the backlog is paid
        # down rather than starting with a rule set nobody can pass.
        run: ruff check app tests --select E9,F63,F7,F82,F401

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations match the models
        # Catches a model change that was committed without a migration.
        run: alembic check

      - name: Tests
        run: pytest tests/ -q

  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        # Non-blocking for now: the existing code has a backlog of
        # no-explicit-any findings that predate this workflow.
        run: npx eslint src
        continue-on-error: true

      - name: Build
        run: npm run build
