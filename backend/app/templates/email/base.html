<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <!--
    Deliberately old-fashioned HTML: tables for layout, inline styles, no
    external CSS or images. Email clients strip <style> blocks, ignore flexbox
    and grid, and block remote content by default, so anything more modern
    degrades unpredictably. Max-width plus width:100% is what makes it readable
    on a phone without media queries.
  -->
  <body style="margin:0; padding:0; background-color:#f4f4f7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background-color:#f4f4f7; padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:560px; background-color:#ffffff; border-radius:8px;
                        border:1px solid #e5e7eb; font-family:-apple-system,BlinkMacSystemFont,
                        'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <tr>
              <td style="padding:28px 32px 8px 32px;">
                <p style="margin:0; font-size:15px; font-weight:600; color:#4f46e5;">
                  MarketEngine AI
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 28px 32px; font-size:15px; line-height:1.6; color:#111827;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 28px 32px; border-top:1px solid #e5e7eb;
                         font-size:12px; line-height:1.5; color:#6b7280;">
                {% block footer %}
                  You received this email because of activity on your MarketEngine AI account.
                {% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
