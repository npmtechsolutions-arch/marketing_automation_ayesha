version: '3.8'

services:
  # ---------- Data stores ----------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: marketengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Backend API ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/marketengine
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      # Required: without it the placeholder secrets above are treated as a
      # production misconfiguration and the service refuses to start.
      DEBUG: "true"
      # Development-only Fernet key for encrypting stored platform credentials.
      # Generate a real one per environment with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      TOKEN_ENCRYPTION_KEY: fdWd56g7RVBIwHV0Vje69Z2NGGBroRXNXmxYwzy7XZQ=
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Apply migrations before serving. Publishing runs in-process as an asyncio
    # worker in this same service -- there is no separate queue service, and
    # nothing else migrates.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'"

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
